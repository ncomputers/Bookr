<body>
  <div class="application">
    <header class="application-header">
      <a class="application-name" href="#" id="home" aria-label="Bookr Gateway">Bookr<strong>DEMO</strong></a>
      <div class="header-workspace">
        <div class="header-category">MANAGE</div>
        <nav class="application-toolbar" aria-label="Application toolbar">
          <button data-company-menu><u>K</u>: Company</button><button disabled><u>Y</u>: Data</button><button disabled><u>Z</u>: Exchange</button>
          <button class="go-to" disabled><u>G</u>: Go To</button><button disabled><u>O</u>: Import</button><button disabled><u>E</u>: Export</button>

      </div>
    </header>
    <div class="application-body">
      <div class="screen-title"><h1>Gateway of Bookr</h1><button disabled aria-label="Close screen">×</button></div>
      <main id="main" tabindex="-1" aria-label="Gateway workspace"><div class="loading">Opening company…</div></main>
      <aside class="function-rail" aria-label="Function keys">
        <button disabled><span><u>F2</u>: Date</span><span>‹</span></button>
        <button disabled><span><u>F3</u>: Company</span><span>‹</span></button>
        <div class="rail-space"></div>
        <div class="rail-preview">Bookr<br><span>INR · Fictional accounts</span></div>
      </aside>
    </div>
    <footer class="command-strip"><span id="screen-hint" role="status" aria-live="polite">Opening customer ledger workspace…</span></footer>
  </div>
